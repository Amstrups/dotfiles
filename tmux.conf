# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind -n M-Left select-pane -L
bind '=' select-layout even-horizontal

# vi-like keybindings
set-window-option -g mode-keys vi

# remove automatic renaming
set-option -wg automatic-rename off

set-option -g status on
set-option -g status-interval 1

set-option -g status-position top
set-option -g status-justify centre

set-option -g status-style fg=colour136,bg=colour235

set-option -g status-left-length 40
set-option -g status-left "#(whoami)#[default]"

set-option -g status-right-length 40
set-option -g status-right "      "

set-window-option -g window-status-style 'fg=colour244 bg=colour235'
set-window-option -g window-status-format ' #I: #W  '

set-window-option -g window-status-current-style 'fg=colour235 bg=colour136'
set-window-option -g window-status-current-format ' #I: #W  '

